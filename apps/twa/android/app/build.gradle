apply plugin: 'com.android.application'

android {
    compileSdkVersion 36
    namespace 'com.fitlynutri.app'

    defaultConfig {
        applicationId 'com.fitlynutri.app'
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 5
        versionName '1.1.3'
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword System.getenv('KEYSTORE_STORE_PASSWORD') ?: 'F1tN!utr1_K3ystore#2026'
            keyAlias 'release'
            keyPassword System.getenv('KEYSTORE_KEY_PASSWORD') ?: 'F1tN!utr1_K3ystore#2026'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    // Custom Tabs — usada para abrir o login do Google fora do WebView
    implementation 'androidx.browser:browser:1.8.0'
    // Puxar-pra-atualizar no WebView
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
